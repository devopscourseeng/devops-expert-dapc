name: CI

# Runs on every pull request, and on pushes to the two protected branches.
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip ruff pytest
          -r src/summit-cafe-api/requirements.txt
          -r src/menu-service/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      # The menu service runs on its own: it has its own pytest.ini, and its
      # app.py would clash with the monolith's app.py in a single pytest run.
      - name: Tests menu-service (pytest)
        working-directory: src/menu-service
        run: pytest -q

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Validate the Grafana dashboard (JSON)
        run: python -m json.tool observability/grafana/dashboards/summit-cafe.json > /dev/null

      - name: Validate the Prometheus config and alert rules (promtool)
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/p:ro"
          prom/prometheus:v2.53.0 check config /p/prometheus.yml
