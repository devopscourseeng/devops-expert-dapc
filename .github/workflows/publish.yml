name: Publish image

# Builds the service images (Summit Cafe API and menu-service) and publishes them
# to GitHub Container Registry (GHCR). One tag publishes both with the same version.
#
# How to publish version 1.2:
#   git tag v1.2 && git push origin v1.2
# or run this workflow by hand from the Actions tab and type "1.2".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # If one service fails, the other is still published (each version is checked on its own).
      fail-fast: false
      matrix:
        service: [summit-cafe-api, menu-service]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Version '$VERSION' is not valid. Use a form like 1.2 or 1.2.0." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version never changes. If the tag already exists, stop here.
      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists. Publish a new version instead." >&2
            exit 1
          fi

      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:smoke
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Smoke test (the container starts and /health answers)
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ matrix.service }}:smoke
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then ok=yes; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke

      - name: Publish for Intel and Apple Silicon computers
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
